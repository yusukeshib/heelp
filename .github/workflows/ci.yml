name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Bundle (ad-hoc signed)
        run: >-
          make bundle
          SIGN_IDENTITY=-
          BUNDLE_IDENTIFIER=dev.yusukeshib.mend
          BUNDLE_NAME=mend

      - name: Verify bundle
        run: |
          test -x mend.app/Contents/MacOS/mend
          plutil -lint mend.app/Contents/Info.plist
          codesign --verify --verbose mend.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mend.app
          path: mend.app
