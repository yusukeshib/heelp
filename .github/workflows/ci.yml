name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Bundle (ad-hoc signed)
        run: >-
          make bundle
          SIGN_IDENTITY=-
          BUNDLE_IDENTIFIER=dev.yusukeshib.ppp
          BUNDLE_NAME=ppp

      - name: Verify bundle
        run: |
          test -x ppp.app/Contents/MacOS/ppp
          plutil -lint ppp.app/Contents/Info.plist
          codesign --verify --verbose ppp.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppp.app
          path: ppp.app
